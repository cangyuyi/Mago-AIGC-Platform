# Legacy reference only. Docker Compose does not mount this file.
# Use nginx.conf for development and nginx.prod.conf for production.

upstream web_upstream {
    server web:3000;
}

upstream api_upstream {
    server api-gateway:8080;
}

upstream agent_upstream {
    server agent:8000;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Frontend
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Python Agent APIs (must precede the generic /api/ location)
    # Normalize specialized Agent API roots before the generic /api/agent/ route.
    location = /api/agent/knowledge { return 308 /api/agent/knowledge/; }
    location = /api/agent/trends { return 308 /api/agent/trends/; }
    location = /api/agent/viral-videos { return 308 /api/agent/viral-videos/; }
    location = /api/agent/topic-recommendations { return 308 /api/agent/topic-recommendations/; }

    location /api/agent/knowledge/ { rewrite ^/api/agent/knowledge/(.*) /api/v1/knowledge/$1 break; proxy_pass http://agent_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 300s; }
    location /api/agent/trends/ { rewrite ^/api/agent/trends/(.*) /api/v1/trends/$1 break; proxy_pass http://agent_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 300s; }
    location /api/agent/viral-videos/ { rewrite ^/api/agent/viral-videos/(.*) /api/v1/viral-videos/$1 break; proxy_pass http://agent_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 300s; }
    location /api/agent/topic-recommendations/ { rewrite ^/api/agent/topic-recommendations/(.*) /api/v1/topic-recommendations/$1 break; proxy_pass http://agent_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_buffering off; proxy_read_timeout 300s; }

    # API Gateway
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Agent service (SSE streaming)
    location /api/agent/ {
        rewrite ^/api/agent/(.*) /api/v1/agent/$1 break;
        proxy_pass http://agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # WebSocket for Agent stream
    location /ws/ {
        proxy_pass http://agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # MinIO console access (dev only)
    location /minio/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $host;
    }
}
