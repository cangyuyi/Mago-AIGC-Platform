name: Docker Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract tag
        id: meta
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/api-gateway.Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/mago-api:${{ steps.meta.outputs.TAG }}
            ${{ secrets.REGISTRY_URL }}/mago-api:latest

      - name: Build & Push Agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/agent.Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/mago-agent:${{ steps.meta.outputs.TAG }}
            ${{ secrets.REGISTRY_URL }}/mago-agent:latest

      - name: Build & Push Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_URL }}/mago-web:${{ steps.meta.outputs.TAG }}
            ${{ secrets.REGISTRY_URL }}/mago-web:latest
